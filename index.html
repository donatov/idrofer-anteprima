<title>Anteprima riservata – Redesign Idrofer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Play:wght@700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --petrolio: #004346; --teal: #01878e; --arancio: #f79d02; --ink: #1e1e20; --mist: #eaf4f4; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    font-family: "Figtree", system-ui, sans-serif; color: var(--ink);
    background: radial-gradient(800px 500px at 80% 10%, rgba(1,135,142,.18), transparent 60%), linear-gradient(180deg, #fff, var(--mist));
  }
  .card { width: min(100%, 420px); background: #fff; border-radius: 22px; padding: 36px 32px 30px; box-shadow: 0 40px 70px -46px rgba(0,67,70,.6); border: 1px solid #cfe2e2; }
  .key { width: 92px; height: 40px; color: var(--arancio); display: block; margin-bottom: 22px; }
  h1 { font-family: "Play", sans-serif; color: var(--petrolio); font-size: 1.7rem; line-height: 1.15; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: #4a5556; line-height: 1.5; }
  label { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 8px; }
  input { width: 100%; font: inherit; padding: 13px 14px; border-radius: 8px; border: 1.5px solid #cfe2e2; }
  input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(1,135,142,.15); }
  input[aria-invalid="true"] { border-color: #c4361f; }
  button { width: 100%; margin-top: 14px; min-height: 50px; border: 0; border-radius: 999px; background: var(--arancio); color: var(--ink); font: 700 1rem "Figtree", sans-serif; cursor: pointer; }
  button:hover { background: #ffb22e; }
  button:disabled { opacity: .7; cursor: progress; }
  :focus-visible { outline: 3px solid var(--arancio); outline-offset: 3px; }
  .error { color: #b42a14; font-size: .9rem; font-weight: 600; margin: 10px 0 0; min-height: 1.3em; }
</style>
</head>
<body>
<main class="card">
  <svg class="key" viewBox="0 0 64 28" aria-hidden="true"><circle cx="11" cy="14" r="8.5" fill="none" stroke="currentColor" stroke-width="4"/><path d="M19.5 14H60v6h-5v4h-5v-4h-4v5h-5v-5h-4" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
  <h1>Anteprima riservata</h1>
  <p>Proposta di redesign del sito Idrofer. Inserisci la password che hai ricevuto per vederla.</p>
  <form id="unlock" novalidate>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <p class="error" id="err" role="alert"></p>
    <button type="submit">Apri l'anteprima</button>
  </form>
</main>

      err.textContent = 'Password non corretta. Controlla e riprova.';
      input.setAttribute('aria-invalid', 'true');
      input.select();
      btn.disabled = false; btn.textContent = "Apri l'anteprima";
    }
  });
</script>
</body>
</html>
